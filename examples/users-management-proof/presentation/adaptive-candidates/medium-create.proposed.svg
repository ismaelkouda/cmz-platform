  <text x="576" y="270" class="label">Prénom</text>
  <rect x="576" y="281" width="416" height="46" rx="8" fill="#ffffff" stroke="#8495ad"/>
  <text x="592" y="309" class="body muted">Saisir le prénom</text>
  <text x="576" y="361" class="label">Email</text>
  <rect x="576" y="372" width="416" height="46" rx="8" fill="#ffffff" stroke="#8495ad"/>
  <text x="592" y="400" class="body muted">nom@example.invalid</text>
  <text x="576" y="452" class="label">Téléphone</text>
  <rect x="576" y="463" width="416" height="46" rx="8" fill="#ffffff" stroke="#8495ad"/>
  <text x="592" y="491" class="body muted">+000 00 00 00 00</text>
  <text x="576" y="543" class="label">Profil</text>
  <rect x="576" y="554" width="416" height="46" rx="8" fill="#ffffff" stroke="#8495ad"/>
  <text x="592" y="582" class="body muted">Choisir un profil</text>

  <path d="M544 674H1024" stroke="#d4deec"/>
  <rect x="576" y="698" width="102" height="46" rx="8" fill="#ffffff" stroke="#8495ad"/>
  <text x="627" y="727" font-size="14" font-weight="700" text-anchor="middle">Annuler</text>
  <rect x="804" y="698" width="188" height="46" rx="8" fill="#2864e8"/>
  <text x="898" y="727" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Créer l’utilisateur</text>
