  <rect x="40" y="279" width="944" height="409" rx="10" fill="#ffffff" stroke="#c0cbda"/>
  <rect x="40" y="279" width="944" height="52" rx="10" fill="#edf2f8"/>
  <text x="58" y="310" class="label">Nom</text>
  <text x="202" y="310" class="label">Email</text>
  <text x="452" y="310" class="label">Profil et rôle</text>
  <text x="690" y="310" class="label">Statut</text>
  <text x="812" y="310" class="label">Mise à jour</text>
  <g class="body">
    <text x="58" y="365">Alpha Test</text><text x="202" y="365">alpha.user@example.invalid</text><text x="452" y="365">Profil A · Superviseur</text><text x="690" y="365" fill="#087b34">Actif</text><text x="812" y="365">26/09/2026</text>
    <text x="58" y="421">Bravo Test</text><text x="202" y="421">bravo.user@example.invalid</text><text x="452" y="421">Profil B · Chef d’équipe</text><text x="690" y="421" fill="#087b34">Actif</text><text x="812" y="421">25/09/2026</text>
    <text x="58" y="477">Charlie Test</text><text x="202" y="477">charlie.user@example.invalid</text><text x="452" y="477">Profil C · Agent</text><text x="690" y="477" fill="#087b34">Actif</text><text x="812" y="477">24/09/2026</text>
  </g>
  <path d="M40 387H984M40 443H984M40 499H984" stroke="#d4deec"/>

  <rect x="0" y="64" width="1024" height="704" fill="#0b1f44" opacity="0.38"/>
  <rect x="544" y="64" width="480" height="704" fill="#ffffff" filter="url(#shadow)"/>
