<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <filter id="shadow" x="-25%" y="-10%" width="150%" height="120%">
      <feDropShadow dx="-6" dy="0" stdDeviation="12" flood-color="#0b1f44" flood-opacity="0.22"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #13213a; }
      .muted { fill: #526581; }
      .label { font-size: 11px; font-weight: 700; }
      .body { font-size: 13px; }
      .strong { font-weight: 700; }
      text[fill="#ffffff"] { fill: #ffffff; }
      text[fill="#087b34"] { fill: #087b34; }
    </style>
  </defs>
  <rect width="1024" height="768" fill="#f6f8fc"/>
  <rect width="1024" height="64" fill="#ffffff"/>
  <path d="M0 63.5H1024" stroke="#d4deec"/>
  <rect x="32" y="18" width="28" height="28" rx="7" fill="#2864e8"/>
  <text x="72" y="39" font-size="16" font-weight="700">CMZ Platform</text>
  <text x="992" y="38" class="muted body" text-anchor="end">Opérateur connecté</text>

  <text x="40" y="105" font-size="24" font-weight="750">Gestion des utilisateurs</text>
  <text x="40" y="129" class="muted body">Consulter, filtrer et créer les comptes utilisateurs.</text>
  <rect x="804" y="88" width="180" height="42" rx="8" fill="#2864e8"/>
  <text x="894" y="114" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Créer un utilisateur</text>

  <rect x="40" y="151" width="944" height="108" rx="10" fill="#ffffff" stroke="#c0cbda"/>
  <rect x="56" y="170" width="300" height="42" rx="7" fill="#ffffff" stroke="#8495ad"/>
  <text x="68" y="187" class="label muted">Recherche</text>
  <text x="68" y="204" class="body muted">Nom, prénom ou email</text>
  <rect x="372" y="170" width="210" height="42" rx="7" fill="#ffffff" stroke="#8495ad"/>
  <text x="384" y="187" class="label muted">Profil</text>
  <text x="384" y="204" class="body">Tous les profils</text>
  <rect x="598" y="170" width="178" height="42" rx="7" fill="#ffffff" stroke="#8495ad"/>
  <text x="610" y="187" class="label muted">Rôle</text>
  <text x="610" y="204" class="body">Tous les rôles</text>
  <rect x="792" y="170" width="176" height="42" rx="7" fill="#ffffff" stroke="#8495ad"/>
