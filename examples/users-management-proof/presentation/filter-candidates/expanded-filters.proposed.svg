<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0b1f44" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #13213a; }
      .muted { fill: #526581; }
      .body { font-size: 13px; }
      .label { font-size: 12px; font-weight: 700; }
      text[fill="#ffffff"] { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1440" height="1024" fill="#f6f8fc"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <path d="M0 71.5H1440" stroke="#d4deec"/>
  <rect x="48" y="20" width="32" height="32" rx="8" fill="#2864e8"/>
  <text x="94" y="42" font-size="17" font-weight="700">CMZ Platform</text>
  <text x="1392" y="42" class="body muted" text-anchor="end">Opérateur connecté</text>

  <text x="48" y="126" font-size="28" font-weight="750">Gestion des utilisateurs</text>
  <text x="48" y="152" class="body muted">Consulter, filtrer et créer les comptes utilisateurs.</text>
  <rect x="1200" y="108" width="192" height="44" rx="8" fill="#2864e8"/>
  <text x="1296" y="135" class="body" font-weight="700" fill="#ffffff" text-anchor="middle">Créer un utilisateur</text>

  <rect x="48" y="184" width="896" height="46" rx="8" fill="#ffffff" stroke="#718096"/>
  <text x="64" y="212" class="body muted">Nom, prénom ou email</text>
  <rect x="48" y="246" width="112" height="36" rx="18" fill="#edf4ff" stroke="#2864e8"/>
  <text x="104" y="269" class="body" font-weight="700" text-anchor="middle">Rôle · Agent</text>
  <rect x="170" y="246" width="116" height="36" rx="18" fill="#edf4ff" stroke="#2864e8"/>
  <text x="228" y="269" class="body" font-weight="700" text-anchor="middle">Statut · Actif</text>

  <rect x="48" y="300" width="896" height="562" rx="12" fill="#ffffff" stroke="#c0cbda"/>
  <rect x="48" y="300" width="896" height="56" rx="12" fill="#edf2f8"/>
  <text x="68" y="334" class="label">Nom</text><text x="226" y="334" class="label">Email</text>
  <text x="510" y="334" class="label">Profil et rôle</text><text x="760" y="334" class="label">Statut</text>
  <g class="body">
    <text x="68" y="396">Alpha Test</text><text x="226" y="396">alpha.user@example.invalid</text><text x="510" y="396">Profil A · Superviseur</text><text x="760" y="396">Actif</text>
    <text x="68" y="456">Bravo Test</text><text x="226" y="456">bravo.user@example.invalid</text><text x="510" y="456">Profil B · Agent</text><text x="760" y="456">Actif</text>
    <text x="68" y="516">Charlie Test</text><text x="226" y="516">charlie.user@example.invalid</text><text x="510" y="516">Profil C · Agent</text><text x="760" y="516">Inactif</text>
  </g>
  <path d="M48 416H944M48 476H944M48 536H944" stroke="#d4deec"/>
  <text x="68" y="828" class="body muted">1–5 sur 42 utilisateurs</text>

  <rect x="968" y="184" width="424" height="678" rx="12" fill="#ffffff" stroke="#c0cbda" filter="url(#shadow)"/>
  <text x="996" y="228" font-size="22" font-weight="750">Filtres</text>
  <text x="996" y="252" class="body muted">2 filtres appliqués</text>
  <rect x="1332" y="204" width="36" height="36" rx="18" fill="#edf2f8"/>
  <text x="1350" y="229" font-size="20" text-anchor="middle">›</text>
  <path d="M968 274H1392" stroke="#d4deec"/>

  <text x="996" y="310" font-size="14" font-weight="750">Essentiels</text>
  <text x="996" y="342" class="label">Profil</text>
  <rect x="996" y="353" width="368" height="46" rx="8" fill="#ffffff" stroke="#718096"/>
  <text x="1012" y="381" class="body">Tous les profils</text><text x="1342" y="381" class="muted" text-anchor="end">⌄</text>
  <text x="996" y="431" class="label">Rôle</text>
  <rect x="996" y="442" width="368" height="46" rx="8" fill="#ffffff" stroke="#718096"/>
  <text x="1012" y="470" class="body">Agent</text><text x="1342" y="470" class="muted" text-anchor="end">⌄</text>
  <text x="996" y="520" class="label">Statut</text>
  <g class="body">
    <rect x="996" y="535" width="84" height="42" rx="21" fill="#ffffff" stroke="#718096"/><text x="1038" y="561" text-anchor="middle">Tous</text>
    <rect x="1090" y="535" width="84" height="42" rx="21" fill="#edf4ff" stroke="#2864e8" stroke-width="2"/><text x="1132" y="561" font-weight="700" text-anchor="middle">Actif</text>
    <rect x="1184" y="535" width="94" height="42" rx="21" fill="#ffffff" stroke="#718096"/><text x="1231" y="561" text-anchor="middle">Inactif</text>
  </g>
  <path d="M996 612H1364" stroke="#d4deec"/>
  <text x="996" y="644" class="body muted">Les groupes supplémentaires apparaissent seulement</text>
  <text x="996" y="664" class="body muted">quand le contrat fournit réellement leurs critères.</text>
  <rect x="996" y="688" width="368" height="50" rx="8" fill="#f8fafc" stroke="#c0cbda"/>
  <text x="1012" y="718" class="body" font-weight="700">Autres critères contractuels</text><text x="1342" y="718" class="muted" text-anchor="end">⌄</text>

  <rect x="968" y="766" width="424" height="96" fill="#ffffff"/>
  <path d="M968 766H1392" stroke="#d4deec"/>
  <rect x="996" y="790" width="142" height="48" rx="9" fill="#ffffff" stroke="#718096"/>
  <text x="1067" y="820" class="body" font-weight="700" text-anchor="middle">Réinitialiser</text>
  <rect x="1190" y="790" width="174" height="48" rx="9" fill="#2864e8"/>
  <text x="1277" y="820" class="body" font-weight="700" fill="#ffffff" text-anchor="middle">Appliquer</text>
</svg>
