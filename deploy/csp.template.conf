# Template runtime — substitué par `deploy/docker-entrypoint.sh` (envsubst),
# même mécanisme que `env.template.js.in` (ADR-0007, un seul artefact de build).
#
# Écrit dans un fichier `include` séparé de `nginx.conf` (jamais envsubst
# directement sur `nginx.conf` lui-même : ce fichier utilise les variables
# nginx `$uri`/`$1`/etc., qu'`envsubst` sans liste explicite remplacerait par
# une chaîne vide — cf. audit-workspace-2026-08-03.md, I-14/I-15).
#
# Variables :
#   CMZ_CSP_CONNECT_SRC   — dérivée automatiquement des 4 URLs backend
#                            (CMZ_AUTHENTICATION_URL / _REPORT_ / _SETTING_ /
#                            _FILE_URL) par docker-entrypoint.sh : origine
#                            unique par schéma+hôte, dédupliquée. Vide en dev
#                            local (URLs relatives /api/*, déjà couvertes par
#                            'self').
#   CMZ_CSP_FRAME_SRC     — PAS dérivable automatiquement : le lien Grafana
#                            embarqué (GrafanaEmbedComponent, module
#                            reporting/monitoring) vient de la réponse
#                            backend (`grafanaLink`), jamais d'une constante
#                            de code. Sans cette variable positionnée à
#                            l'origine réelle de Grafana pour cet
#                            environnement, l'iframe sera bloquée par CSP
#                            (défaut : aucune source externe — échoue fermé,
#                            pas ouvert). À renseigner explicitement au
#                            déploiement, ex. :
#                              -e CMZ_CSP_FRAME_SRC=https://grafana.example.org
#
# Note de sécurité connexe (non résolue par ce fichier) : `SafeUrlPipe`
# (libs/shared/ui) appelle `DomSanitizer.bypassSecurityTrustResourceUrl` sur
# `grafanaLink` sans aucune vérification d'origine — CSP `frame-src` est
# aujourd'hui la seule barrière réelle contre l'embarquement d'une iframe
# arbitraire si la réponse backend est un jour falsifiable (MITM, backend
# compromis). Raison de plus pour ne jamais laisser cette variable au
# défaut « aucune source externe » sans le vouloir explicitement en
# production — mais aussi de ne jamais la mettre à `*`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' ${CMZ_CSP_CONNECT_SRC}; frame-src 'self' ${CMZ_CSP_FRAME_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
