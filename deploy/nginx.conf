server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP générée à l'entrypoint depuis deploy/csp.template.conf — jamais
    # envsubst directement sur ce fichier (utiliserait $uri/$1 ci-dessous),
    # cf. audit-workspace-2026-08-03.md, I-14/I-15.
    include /etc/nginx/conf.d/csp.conf;

    # SPA Angular — toutes les routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés — cache long
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pas de cache sur le shell HTML ni la config runtime (entrypoint / déploiements)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}

