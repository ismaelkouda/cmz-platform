version: 2
updates:
  # Écosystème Bun natif — catalog centralisé (ADR-0005). Depuis 2026,
  # Dependabot prend officiellement en charge le bun.lock texte avec
  # `package-ecosystem: bun`. Canary OPS-26 : chaque PR doit modifier le
  # lockfile sans altérer ses sections catalog/catalogs, vérifiées par
  # `check:bun-lock-catalog-integrity` avant toute fusion.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      lint-format:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'angular-eslint'
          - 'prettier*'
    commit-message:
      prefix: 'build(deps)'

  # Actions GitHub utilisées par les workflows CI.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci(deps)'

  # Image de base du Dockerfile (audit G-4).
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'build(docker)'
