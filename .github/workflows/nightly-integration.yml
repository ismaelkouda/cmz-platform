# Oracle Tier 2 — intégration app (A-2026-07-30-08)
#
# Tier 1 (corpus:ci, job `corpus` / --structural-only — ADR-0015) : modules isolés.
# Tier 2 (ce workflow) : builds app development + production (coûteux).
# SIMPL-1 : filet de sécurité profond quotidien pour les deux preuves
# bibliothèque, même lorsqu'aucun diff PR n'en déclenche l'exécution.
# strictTemplates (ngc) est bloquant en PR — job `oracle` de ci.yml (A-10).
#
# Déclenchement : nightly 03:00 UTC + manuel (workflow_dispatch).
# Bundle initial : apps/backoffice-angular/bundle-metrics.json (audit E-8).
#
# OPS-23 (2026-08-20) : ce workflow appelle `bunx nx run backoffice-angular:
# build:*` sans jamais fixer NX_NO_CLOUD — même angle mort que ci.yml avant
# OPS-22, généralisé ici après confirmation empirique (CI réelle, run nightly
# du 2026-08-20) que ce job échoue à l'identique : "NX Cloud: Workspace is
# unable to be authorized. Exiting run. Invalid Credentials (Nx Cloud ID)".
# Ce workflow ne déclare aucun NX_CLOUD_ACCESS_TOKEN dans son env (seul
# ci.yml et corpus-full.yml le font) — la variable est donc systématiquement
# vide ici, pas seulement en cas d'incident : sans ce fallback, TOUT run
# nightly échoue, schedule ou dispatch, indépendamment de Dependabot. Même
# principe qu'OPS-22 : l'indisponibilité d'un accélérateur de cache ne doit
# jamais faire échouer le pipeline, seulement le ralentir.
#
# Mise à jour L1 (2026-10-10) : le constat OPS-23 ci-dessus décrit l'état
# d'août. Aujourd'hui les quatre builds du job `integration` reçoivent
# NX_CLOUD_ACCESS_TOKEN, sur `main` seulement ; les e2e mémoire et le build
# d'analyse de bundle restent en cache local. Le repli NX_NO_CLOUD demeure.

name: Nightly — Tier 2 intégration

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Audit G-8 : ne pas empiler nightly + dispatch concurrents.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Moindre privilège : le jeton du workflow ne peut que lire le dépôt. Un job
# qui doit écrire le déclare lui-même, et `check:workflow-privileges` le refuse
# s'il n'est pas dans sa liste fermée ou s'il n'est pas lié à `main`.
permissions:
  contents: read

env:
  NODE_VERSION: '22.22.3'
  BUN_VERSION: '1.3.14'
  # Par défaut, rien n'utilise Nx Cloud : le cache local suffit et aucun
  # secret n'est distribué au workflow. Le jeton n'est remis, pour le seul
  # code de `main`, qu'aux étapes listées dans `ALLOWED_SECRET_HANDOVERS`
  # (tools/check-workflow-privileges.mjs) : les quatre builds de
  # `integration`.
  # Toute autre commande Nx de ce fichier tourne en cache local, par choix.
  # Une PR ou un lancement manuel depuis une autre branche n'a jamais le jeton.
  NX_NO_CLOUD: 'true'

jobs:
  integration:
    name: Oracle Tier 2 — backoffice-angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build intégration (development)
        id: nx-build-development
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
          NX_NO_CLOUD: ${{ (github.ref != 'refs/heads/main' || secrets.NX_CLOUD_ACCESS_TOKEN == '') && 'true' || 'false' }}
        run: bunx nx run backoffice-angular:build:development

      - name: Build production
        id: nx-build-production
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
          NX_NO_CLOUD: ${{ (github.ref != 'refs/heads/main' || secrets.NX_CLOUD_ACCESS_TOKEN == '') && 'true' || 'false' }}
        run: bunx nx run backoffice-angular:build:production

      - name: Build React workspace proof (production)
        id: nx-build-react-workspace
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
          NX_NO_CLOUD: ${{ (github.ref != 'refs/heads/main' || secrets.NX_CLOUD_ACCESS_TOKEN == '') && 'true' || 'false' }}
        run: bunx nx run workspace-react-proof:build

      - name: Build React C5 proof (production)
        id: nx-build-react-c5
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
          NX_NO_CLOUD: ${{ (github.ref != 'refs/heads/main' || secrets.NX_CLOUD_ACCESS_TOKEN == '') && 'true' || 'false' }}
        run: bunx nx run users-management-react-proof:build

      # WORKSPACE-TABS-4 — profil Chromium long, volontairement absent des PR :
      # 50 cycles d'échauffement + 100 cycles mesurés, puis quatre passes à
      # huit vues. Le dist production ci-dessus est réutilisé sans rebuild.
      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Profil mémoire du workspace (production)
        run: bunx nx run backoffice-angular:e2e-workspace-memory
        env:
          E2E_SKIP_BUILD: '1'

      # WORKSPACE-TABS-11 — preuve native React, sans transposer la limite
      # Angular de huit vues : le catalogue fermé actuel contient deux vraies
      # vues. 50 cycles d'échauffement, 100 cycles mesurés et quatre passes
      # 1 → 2 → 1 qualifient sa propre capacité et sa destruction.
      - name: Profil mémoire du workspace React (production)
        run: bunx nx run workspace-react-proof:e2e-workspace-memory
        env:
          E2E_SKIP_BUILD: '1'

      # REACT-PLATFORM-10 — le dialogue C5 est monté/détruit 100 fois après
      # échauffement. Le profil CDP refuse toute croissance DOM/listeners et
      # borne le heap ; il reste isolé du smoke PR pour ne pas rallonger chaque
      # changement sans rapport avec cette surface.
      - name: Profil mémoire de la surface C5 React (production)
        run: bunx playwright test -c apps/users-management-react-proof/playwright.memory.config.mjs
        env:
          E2E_SKIP_BUILD: '1'

      - name: Publier les profils mémoire du workspace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-memory-profiles
          path: test-results/**/workspace-*-profile*.json
          retention-days: 30
          if-no-files-found: error

      - name: Publier le profil mémoire C5 React
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: users-management-react-memory-profile
          path: test-results/**/users-management-react-memory-profile.json
          retention-days: 30
          if-no-files-found: error

      # Audit E-8 — métrique commitée = vérité ; dérive = CI rouge. Doit
      # tourner ICI, juste après le build production propre ci-dessus —
      # JAMAIS après le rebuild --source-map=true plus bas, qui injecte un
      # commentaire sourceMappingURL dans chaque fichier et change donc ses
      # octets (et son nom hashé) : mesurer ce dist-là comparait un artefact
      # non représentatif à la métrique commitée, faux rouge garanti.
      #
      # 2026-09-11 (OPS-25 suite) : root cause des 19/20 derniers runs rouges.
      # Deux causes cumulées, toutes deux corrigées ici :
      #  1. l'ordre ci-dessus (dist pollué par les sourcemaps) ;
      #  2. `check:docs-freshness`/`check:bundle-metrics-freshness`
      #     remplacent un `git diff` brut post-régénération : sans date figée
      #     (STATUS_DATE / BUNDLE_METRICS_DATE), `generate-status.mjs` et
      #     `record-bundle-metrics.mjs` tamponnent la date du jour même quand
      #     le contenu mesuré n'a pas bougé — faux rouge quotidien garanti,
      #     schedule sans rapport avec la dernière fusion de docs. Les deux
      #     scripts figent maintenant la date déjà commitée avant de mesurer :
      #     seul un octet réellement différent fait encore échouer ce step.
      #  3. Constaté en validant ce correctif par workflow_dispatch réel sur
      #     cette branche : le build production n'est PAS garanti bit-à-bit
      #     identique entre un poste local macOS et ubuntu-latest (534 473
      #     vs 534 545 octets, même chunk ExcelJS). `bundle-metrics.json`
      #     doit donc toujours être (re)mesuré et committé depuis un run CI
      #     réel (ce workflow, `workflow_dispatch` si besoin hors schedule),
      #     jamais depuis `bun run bundle:metrics` sur un poste de dev.
      - name: check:docs-freshness + check:bundle-metrics-freshness
        run: |
          bun run check:docs-freshness
          bun run check:bundle-metrics-freshness

      # record-bundle-metrics.mjs écrit sa mesure fraîche AVANT que le step
      # ci-dessus échoue sur la comparaison — la publier permet de récupérer
      # les octets réels mesurés par CI (ubuntu-latest) sans deviner depuis
      # un poste local (build non garanti bit-à-bit identique cross-OS,
      # constaté 2026-09-11 : macOS 534 473 octets vs CI 534 545 octets).
      - name: Publier bundle-metrics.json mesuré (debug drift)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-metrics-measured
          path: apps/backoffice-angular/bundle-metrics.json
          retention-days: 7

      # Audit P-5 (audit-workspace-2026-08-02-revue-finale.md) : composition
      # réelle du bundle initial (main-*.js, 882,18 kB au 2026-08-03, marge
      # de 17,82 kB avant le seuil d'avertissement 900 kB — P1-27). Rebuild
      # dédié avec sourcemaps (jamais dans la config `production` par défaut
      # — on ne veut pas les livrer en production) ; informationnel,
      # `continue-on-error` — ne bloque jamais la CI sur la composition, le
      # step précédent a déjà statué sur le budget et la régression réels.
      - name: Analyse de composition du bundle (source-map-explorer)
        continue-on-error: true
        run: |
          bunx nx run backoffice-angular:build:production --source-map=true
          bunx source-map-explorer \
            dist/apps/backoffice-angular/browser/main-*.js \
            --html > bundle-composition-report.html
          echo "Rapport généré : bundle-composition-report.html"

      - name: Publier le rapport de composition du bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-composition-report
          path: bundle-composition-report.html
          retention-days: 30
          if-no-files-found: ignore

  library-candidate-isolation:
    name: Library candidate isolation nightly (${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-docker
            runner: ubuntu-24.04
          - profile: macos-sandbox
            runner: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:library-candidate-isolation (${{ matrix.profile }})
        run: bun run check:library-candidate-isolation

  library-end-to-end:
    name: Library integration nightly (create-app → Material → Tailwind)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:library-setup-integration
        run: bun run check:library-setup-integration
