# CI Pipeline — cmz-platform
# ADR-0006 : les garde-fous locaux (hooks Husky) sont reproduits ici pour qu'ils
# soient incontournables. --no-verify local ne passe pas en CI.
#
# Stratégie : nx affected pour ne reconstruire que ce qui a changé.
# Nx Cloud (décision G-7/T6-4 : claim + activer) :
# - `nxCloudId` dans nx.json (workspace Nx Cloud)
# - secret repo `NX_CLOUD_ACCESS_TOKEN` (CI access token émis après claim)
#
# OPS-22 (2026-08-19) : GitHub n'expose pas les secrets du dépôt aux PR
# ouvertes par Dependabot (protection anti-exfiltration standard). Sans
# NX_CLOUD_ACCESS_TOKEN, Nx (v23+) n'exécute plus aucune commande — il
# n'existe plus de dégradation silencieuse vers le cache local seul,
# contrairement à ce que supposait le runbook G-7 d'origine (« bruit 401,
# pas un gate CI »). NX_NO_CLOUD=true calculé ci-dessous force le repli sur
# le cache local (toujours actif) sans jamais tenter Nx Cloud — le principe
# général : l'indisponibilité d'un accélérateur de cache ne doit jamais
# faire échouer le pipeline, seulement le ralentir. S'applique à tout
# contexte sans le secret (Dependabot aujourd'hui, tout futur cas
# équivalent), pas seulement Dependabot nommément.
#
# OPS-23 (2026-08-20) : confirmé en CI réelle que ce même symptôme touchait
# aussi nightly-integration.yml (run nightly, aucune PR/Dependabot en jeu) —
# preuve que le problème est bien la dépendance structurelle de Nx 23+ au
# token, pas un cas Dependabot isolé. Fallback NX_NO_CLOUD généralisé aux
# 3 workflows (ci.yml, corpus-full.yml, nightly-integration.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Audit G-8 : un seul run actif par PR / branche — annule le précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.3'
  BUN_VERSION: '1.3.14'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' && 'true' || 'false' }}

jobs:
  # ─── Job 1 : Garde-fous socle (rapide, bloquant) ─────────────────────────
  guardrails:
    name: Garde-fous socle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour nx affected --base=origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rejoue les contrôles des hooks locaux (ADR-0006)
      - name: check:engines
        run: node tools/check-engines.mjs

      - name: check:versions (catalog sans dérive)
        run: node tools/check-catalog-usage.mjs

      - name: check:weight (poids + plafond lignes, tools/ inclus)
        run: node tools/check-file-weight.mjs --all

      - name: check:project-names (ADR-0003 nommage @cmz/)
        run: node tools/check-project-names.mjs

      # Audit A-5 — chaque lib doit exposer build + lint (oracle package-based)
      - name: check:targets (build + lint sur toutes les libs)
        run: bun run check:targets

      # Audit D-1 / P1-7 / ADR-0004 — imports externes déclarés dans package.json
      - name: check:declared-deps (graphe déclaré complet)
        run: bun run check:declared-deps

      # Audit staff 2026-08-29 — retire-module.mjs / check-no-orphan-references.mjs
      # doivent rester fiables : suite node:test dédiée (transaction, restauration
      # sur échec, bun install combiné à la finalisation, chemins d'exemption).
      - name: check:retire-module (suite retire-module.mjs)
        run: bun run check:retire-module

      # Audit A-12 — une violation scope: doit faire échouer ESLint (barrière machine)
      - name: check:boundary-negative (scope cross-module interdit)
        run: bun run check:boundary-negative

      # Chantier Q, Q-6/Q-7 (ADR-0024/ADR-0025) — layering test rendu
      # exécutable : type:domain/type:constants doit rester compilable sans
      # Angular (0 import @angular/*, 0 décorateur Angular). RxJS autorisé.
      - name: check:framework-purity (0 couplage Angular en domain/constants)
        run: bun run check:framework-purity

      # Audit B-3 / ADR-0014 — pin SHA legacy versionné (concordance si SEOS_LEGACY_ROOT)
      - name: check:legacy-lock
        run: bun run check:legacy-lock

      # Trouvé lors de l'audit self-review post-ADR-0022 (2026-08-11) :
      # `check:pair-schema` (fixture du schéma de paires corpus) et
      # `check:corpus-tools` (tests node:test de la logique pure de l'Oracle
      # corpus — resolveStatus, mapping-helpers, oracle-levels, module-gate)
      # étaient définis dans package.json/check:all mais jamais invoqués par
      # aucun gate automatisé (ni husky, ni CI) — un script qui existe sans
      # jamais s'exécuter n'est qu'une intention (cf. philosophie du
      # référentiel, taches-restantes.md). Câblés ici.
      - name: check:pair-schema (schéma des paires corpus)
        run: bun run check:pair-schema

      - name: check:corpus-tools (tests unitaires de l'Oracle corpus)
        run: bun run check:corpus-tools

      # PLAT-1…3 / ADR-0030 — le modèle sémantique canonique est validé hors
      # des profils cibles. Provenance, convergence des deux sources, compilation
      # des deux renderers et manifests déterministes sont bloquants ensemble.
      - name: check:generator-platform (Evidence + Semantic IR + renderers)
        run: bun run check:generator-platform

      # Conception sans code manuel — chaque artefact versionné doit rester
      # complet, target-neutral et traçable vers un contrat backend exact.
      - name: check:application-designs (contrats de conception)
        run: bun run check:application-designs

      # Preuve versionnée non simulée : Postman analogue reste reference, le
      # contrat cible planned autorise seul la conception, puis le renderer et
      # le harnais de page passent ngc, Nx build, ESLint et les tests réels.
      - name: check:application-pipeline (preuve bout-en-bout réelle)
        run: bun run check:application-pipeline

      # Une composition n'est automatisée qu'après des preuves métier relisibles.
      - name: check:composition-registry (maturité fondée sur les cas)
        run: bun run check:composition-registry

      # Un rôle n'existe que s'il a un producteur IR, un consommateur réel et
      # une forme cible validée. La première tranche verticale couvre `screen`.
      - name: check:target-archetype-coverage (rôles réellement consommés)
        run: bun run check:target-archetype-coverage

      # J-2 (audit-workspace-2026-08-03.md, chantier J) — ADR-0010 fait de
      # conventions/angular-22.profile.json la source unique lisible par
      # machine des conventions de code ; J-1 l'a rendu vérifiable
      # (tools/check-convention-profile.mjs). Bloquant dès l'ajout : 7/7
      # règles déjà à 0 violation sur tout le dépôt (105 fichiers codemodés
      # le 2026-08-03) — pas de dette pré-existante à tolérer comme pour
      # security-audit/i18n-check.
      - name: check:convention-profile (ADR-0010)
        run: bun run check:convention-profile

      # T3-4 / DT-6 — provideDevPermissions confiné à isDevMode() (fail-closed prod)
      - name: check:dev-permissions-prod
        run: bun run check:dev-permissions-prod

      # `eslint.config.mjs` `files:` ne couvre que .ts/.tsx/.js/.jsx et `tools/`
      # n'est pas un projet Nx : ~130 tools/**/*.mjs n'étaient lintés par aucune
      # gate. Ce script couvre tout tools/**/*.mjs sauf trois zones à dette
      # pré-existante isolée : seos/** (vendored octet-stable), mock-server/**
      # (sous-package, 51 erreurs) et corpus/** (13 erreurs).
      - name: check:lint-tools (eslint sur tools/**/*.mjs)
        run: bun run check:lint-tools

      # Audit Big Tech 2026-08-14 — root cause du bug "script dans check:all
      # jamais réellement câblé en CI" (rencontré 3 fois : check:pair-schema/
      # check:corpus-tools en 2026-08-11, check:dto-schema/check:pattern-nx:
      # workflow-action/action-request/read-only-view en 2026-08-14).
      # Dernière step du job guardrails à dessein : elle vérifie que TOUS
      # les scripts check:all (y compris ceux ajoutés ci-dessus) ont une
      # step CI ou un hook husky dédié — se garde donc elle-même de devenir,
      # un jour, le prochain script orphelin non détecté.
      - name: check:ci-wiring (angle mort — gate déclaré vs gate exécuté)
        run: node tools/check-ci-wiring.mjs

      - name: Format check (Prettier)
        run: bun run format:check

  # ─── PLAT-5F : durabilité de publication multi-filesystem ───────────────
  # Le gate général exécute déjà les tests sur Linux. Cette matrice rend la
  # preuve explicite sur chaque profil de stockage supporté et échoue si le
  # runner ne correspond pas au type statfs déclaré. Les tests lancent de vrais
  # processus éditeurs, les tuent par SIGKILL après chacun des deux renommages,
  # puis vérifient la reprise complète par manifests et hashes.
  publication-durability:
    name: Publication durability (${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-ext4
            runner: ubuntu-24.04
            platform: linux
          - profile: macos-apfs
            runner: macos-14
            platform: darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:publication-durability (${{ matrix.profile }})
        env:
          CMZ_PUBLICATION_PLATFORM: ${{ matrix.platform }}
        run: bun run check:publication-durability

  # ─── Job T4-5 : secret scanning (gitleaks) ───────────────────────────────
  # ADR-0006 : même contrôle que husky pre-push (`check:secrets -- --pre-push`).
  # Ici scan **complet** de l'historique git (detect, blocking).
  # Binaire piné via tools/check-secrets.mjs — 0 secret GITLEAKS_LICENSE.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: check:secrets (gitleaks detect)
        run: node tools/check-secrets.mjs

  # ─── Job T4-3 : SAST complémentaire (Semgrep) ────────────────────────────
  # Big Tech gap identifié (`taches-restantes.md`) : ESLint (style/qualité)
  # et gitleaks (secrets, job ci-dessus) ne couvrent pas les patterns de
  # vulnérabilité applicative (injection, XSS, désérialisation dangereuse,
  # etc.). Semgrep choisi plutôt que CodeQL : gratuit sans dépendre d'un
  # plan GitHub Advanced Security (statut du repo non confirmé), CLI open
  # source, pas de dépendance à une Action tierce non pinnée.
  #
  # **Mode rapport seul, volontairement non bloquant pour ce premier
  # rollout** (2026-08-11) : je n'ai pas pu exécuter Semgrep localement
  # avant d'ajouter ce job (sandbox sans accès réseau sortant vers le
  # registre de règles — `semgrep --version` reste bloqué indéfiniment),
  # donc aucune vérification empirique de ce qu'il remonterait sur les
  # ~2700 fichiers du dépôt n'a pu être faite avant ce commit. Pas de
  # `--error` (Semgrep n'échoue alors jamais sur des findings) +
  # `continue-on-error: true` (n'échoue pas non plus sur un crash/timeout
  # de l'outil) : le job tourne et publie ses résultats sans jamais
  # bloquer un push/PR. À repasser en bloquant une fois qu'un run réel (sur
  # GitHub, avec accès réseau) a été revu par un humain et que les faux
  # positifs pertinents ont été exclus (`.semgrepignore` / commentaires
  # `nosemgrep`) — voir T4-3 (`taches-restantes.md`).
  sast:
    name: SAST (Semgrep, rapport seul)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep (piné)
        run: pip install semgrep==1.172.0

      - name: Semgrep scan (p/default + p/owasp-top-ten, rapport seul)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --metrics off \
            --exclude 'dist' \
            --exclude 'node_modules' \
            --exclude 'corpus' \
            .

  # ─── Job docs : fraîcheur des blocs générés (audit E-5 / P1-9) ───────────
  docs-freshness:
    name: Docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 nécessaire pour check:dto-schema-breaking-changes
          # (T2-2), qui compare le schéma DTO committé sur la branche cible
          # de la PR (`git show origin/<base>:...`) contre l'état régénéré —
          # un clone superficiel (défaut fetch-depth: 1) ne contiendrait pas
          # cette révision. Même besoin que le job oracle (cf. `Set NX base
          # branch` plus bas dans ce fichier).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: check:docs-freshness (preuve octets avant/après régénération)
        run: bun run check:docs-freshness

      # T2-2 — gate de fraîcheur schéma↔DTO (docs/architecture/schema/
      # dto.schema.json régénéré en mémoire depuis les 303 DTOs TS et
      # comparé à la version committée, même mécanisme que
      # check:docs-freshness ci-dessus). Trouvé lors de l'audit Big Tech du
      # 2026-08-14 : ce script existait dans check:all depuis T2-2
      # (2026-08-13) mais n'avait jamais reçu de step CI dédiée — jamais
      # exécuté automatiquement malgré taches-restantes.md affirmant
      # "branché dans check:all" (vrai littéralement, mais check:all
      # lui-même n'est jamais invoqué en CI/husky, cf. commentaire
      # check:pair-schema/check:corpus-tools ci-dessus dans le job
      # guardrails, même classe de bug).
      #
      # OPS-12a (2026-08-16) : ce step échouait en CI depuis son ajout
      # (ERR_MODULE_NOT_FOUND 'typescript') — le job était conçu Node pur
      # (check:docs-freshness ne lit que project.json/corpus, sans
      # dépendance npm), une hypothèse restée vraie jusqu'à l'ajout de ce
      # step, qui importe `typescript` via generate-dto-schema.mjs et donc
      # exige node_modules. bun install ajouté ci-dessous pour combler cet
      # angle mort réel, jamais détecté car aucune run CI n'avait encore été
      # observée après l'ajout du step avant OPS-12a.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:dto-schema (T2-2, fraîcheur schéma↔DTO)
        run: node tools/check-dto-schema.mjs

      # T2-2 (2026-08-18) — deux volets restants du chantier, câblés dès leur
      # écriture pour éviter la même classe de bug « gate fantôme dans
      # check:all mais jamais invoqué en CI » documentée ci-dessus (détectée
      # cette fois par tools/check-ci-wiring.mjs avant tout commit, pas après
      # coup — voir docs/architecture/taches-restantes.md, entrée T2-2).
      - name: check:mapper-dto-conformity (T2-2, mappers ↔ DTO required)
        run: node --test tools/check-mapper-dto-conformity.test.mjs && node tools/check-mapper-dto-conformity.mjs

      - name: Set schema diff base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SCHEMA_DIFF_BASE=origin/${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "SCHEMA_DIFF_BASE=HEAD~1" >> $GITHUB_ENV
          fi

      - name: check:dto-schema-breaking-changes (T2-2, diff sémantique)
        run: node --test tools/check-dto-schema-breaking-changes.test.mjs && node tools/check-dto-schema-breaking-changes.mjs --base ${{ env.SCHEMA_DIFF_BASE }}

  # ─── Job 2 : Oracle de vérification (nx affected) ────────────────────────
  oracle:
    name: Oracle — lint + build + ngc + test
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set NX base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "NX_BASE=origin/${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "NX_BASE=HEAD~1" >> $GITHUB_ENV
          fi

      # ESLint — boundaries Nx + règles Angular (ADR-0010 portail niveau Lint)
      # --max-warnings=0 est porté par targetDefaults.lint (nx.json), pas par nx CLI
      - name: Lint (nx affected)
        run: bunx nx affected -t lint --base=${{ env.NX_BASE }}

      # Build package-based — tsc --noEmit par lib (audit A-4)
      - name: Build (nx affected)
        run: bunx nx affected -t build --base=${{ env.NX_BASE }}

      # Audit A-10 / P1-8 — strictTemplates bloquant en PR (shift-left)
      - name: strictTemplates (ngc)
        run: bunx ngc -p apps/backoffice-angular/tsconfig.app.json --noEmit

      # Tests Vitest — ADR-0008. Ne pas passer `--passWithNoTests` ici : Nx
      # le forward à tous les targets ; `@angular/build:unit-test` (app) a un
      # schéma strict et échoue. Les libs ont `passWithNoTests: true` dans
      # tools/vitest-lib.config.ts (SSoT).
      - name: Test (nx affected)
        run: bunx nx affected -t test --base=${{ env.NX_BASE }}

  # ─── Job T12-6 : e2e Playwright smoke login (ADR-0008) ───────────────────
  # Mock-server local + serve app — 0 secrets staging. Staging réel = T12-7.
  e2e-smoke:
    name: E2E smoke — login (Playwright)
    runs-on: ubuntu-latest
    needs: guardrails
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: E2E smoke login
        run: bunx nx run backoffice-angular:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Job 4 : Corpus SEOS — structural-only (ADR-0015 / B-6) ───────────────
  # Vérif. structurelle Nx Tier 1 — PAS de correspondance legacy.
  # Source de vérité modules : package.json → corpus:ci (audit B-7 / P1-14).
  # Full verify + legacy : workflow corpus-full.yml (audit B-5), sur main uniquement.
  corpus:
    name: Corpus SEOS — structural-only
    runs-on: ubuntu-latest
    needs: guardrails
    env:
      CORPUS_STRUCTURAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Corpus structural-only (bun run corpus:ci)
        run: bun run corpus:ci
  dead-code:
    name: Dead-code (knip)
    runs-on: ubuntu-latest
    needs: guardrails
    # Bloquant : contrat monorepo package-based documenté
    # (docs/architecture/knip-contrat.md) — exit 0 local/CI attendu.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:dead-code (knip)
        run: bun run check:dead-code

  # ─── Job I-12/I-13 : audit des dépendances (bun audit) ───────────────────
  # Complète Dependabot (N2, PR hebdo) par une porte en CI — Dependabot ouvre
  # des PR mais ne bloque rien tant qu'elles ne sont pas mergées.
  # `--audit-level=high` : ne remonte que high/critical (moderate/low restent
  # visibles via Dependabot, pas bloquants ici — cf. audit-workspace-
  # 2026-08-03.md, analyse par chemin de code réel avant ce commit).
  #
  # Bloquant depuis le 2026-08-04 (backlog #7, cartographie). Historique : au
  # moment où ce job a été écrit, seuls 2 avisos (axios, brace-expansion)
  # avaient été identifiés manuellement. Un vrai `bun audit --audit-level=high`
  # (bun installé localement pour l'occasion, absent jusque-là de
  # l'environnement d'audit) en a trouvé **8** (axios, brace-expansion — 3
  # CVE distincts, fast-uri, ip-address), tous dans l'outillage de build
  # (nx/eslint/@angular-devkit/@angular/cli/commitlint) sauf brace-expansion
  # dont une chaîne remonte réellement jusqu'à `exceljs` (dépendance
  # applicative de `@cmz/shared-browser`, via
  # `unzipper → fstream → rimraf@2 → glob@7 → minimatch@3` — la vérification
  # d'origine, limitée au seul champ `browser` d'exceljs, n'avait pas vu cette
  # chaîne Node-only). Les 8 corrigés par un bloc `overrides` racine
  # (`package.json`) forçant `axios@1.19.0`/`brace-expansion@5.0.9`/
  # `fast-uri@4.1.2`/`ip-address@10.4.0` dans tout l'arbre — sans les ajouter
  # en dépendance directe (`bun update <pkg>` seul les ajoute à tort en
  # dépendance directe de l'app, testé et annulé avant ce commit). `bun audit
  # --audit-level=high` : 0 vulnérabilité après. Vérifié aussi : aucun import
  # direct d'`axios` dans `apps/`/`libs/` (grep, 0 résultat — usage nx interne
  # uniquement) ; build/lint/`check:boundary-negative` rejoués après le bump,
  # 0 régression.
  security-audit:
    name: Dependency audit (bun audit)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exception étroite et auto-invalidante : avant tout --ignore, ce gate
      # prouve image-size@0.5.5 + intégrité npm exacte, chaîne optionnelle via
      # less@4.5.1, absence des parseurs ICNS/JXL/HEIF concernés et absence de
      # tout fichier .less Git-visible. Une version, un parseur, un usage ou la
      # date de revue qui dérive fait échouer la CI avant l'audit.
      - name: check:dependency-audit-exception (preuve image-size)
        run: bun run check:dependency-audit-exception

      # GitHub ne publie aucun correctif pour ces deux GHSA au 2026-09-03.
      # L'ignore porte sur leurs identités exactes, après la preuve ci-dessus ;
      # tous les autres avis high/critical restent bloquants.
      - name: bun audit (high/critical bloquant)
        run: |
          bun audit --audit-level=high \
            --ignore GHSA-w3rx-r6r6-pgpr \
            --ignore GHSA-5p2g-fcmc-qvqq

  # ─── Job K-1/K-2 : clés i18n manquantes (check:i18n) ─────────────────────
  # Audit-workspace-2026-08-03.md, chantier K. `tools/check-i18n.mjs` compare
  # les clés réellement définies dans `fr.translation.ts` (transpilé et
  # importé, pas parsé à l'œil) aux clés référencées dans `apps/`+`libs/`.
  #
  # Bloquant depuis le 2026-08-04 (backlog #7, cartographie). État mesuré à
  # l'écriture de ce job : 313 clés référencées sans définition. K-3 (triage
  # des faux positifs de la regex — 5 correctifs successifs documentés dans
  # `tools/check-i18n.mjs`) et K-4 (rédaction des traductions manquantes) ont
  # réduit ce chiffre à **0** (`node tools/check-i18n.mjs`, sans
  # `--warn-only` : 0 clé référencée sans définition, 251 clés définies mais
  # jamais référencées — avertissement seulement, pas bloquant). Plus de
  # dette pré-existante à tolérer : `continue-on-error` retiré.
  i18n-check:
    name: i18n keys (check:i18n)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:i18n (clés référencées sans définition)
        run: node tools/check-i18n.mjs

  # ─── Job T6-2 : inventaire de licences tierces (license-checker) ─────────
  # Reproduit en continu la méthode manuelle de
  # docs/architecture/licences-tierces.md — jusqu'ici rejouée à la main,
  # dérivée silencieusement dès le 2026-08-04 (ajout d'axe-core, MPL-2.0,
  # jamais reporté dans le document faute d'automatisation). Production
  # 100 % permissive bloquante sans exception ; dev-only limité à une
  # allowlist nominative documentée (tools/check-licenses.mjs).
  licenses:
    name: Third-party licenses (license-checker)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: check:licenses (production permissive + exceptions dev-only)
        run: node tools/check-licenses.mjs

  # ─── Job F-4 / H-3 / P1-11 : fichiers byte-identiques cross-module ───────
  # Baseline 0 (post F-7) — bloquant. Contrainte aussi dans pattern.json (H-3)
  # et check:all / gate corpus module (H-2).
  duplicates:
    name: Duplicate files (MD5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: check:duplicates (empreinte MD5 cross-module + contrainte H-3)
        run: node tools/check-duplicate-files.mjs

      # Audit O-1/O-2 (P1-25, ADR-0020) : duplication de la famille
      # workflow-action modulo nom de module — invisible au check MD5
      # ci-dessus. Bloquant à la hausse seulement (isolation scope:* choisie,
      # pas une dette à zéro) contre docs/architecture/
      # family-duplication-metrics.json.
      - name: check:duplicates --family (P1-25 / ADR-0020, bloquant à la hausse)
        run: node tools/check-duplicate-files.mjs --family

      # ADR-0030 — le profil Angular/Nx reste un contrat cible transitoire,
      # mais doit être cohérent tant qu'il alimente les oracles existants.
      - name: check:pattern-profile-schema (registre + placeholders + références)
        run: bun run check:pattern-profile-schema

      # Audit J-9 (onzième passe, 2026-08-04) : conformité structurelle au
      # pattern crud-entity Nx-shaped (N-7, docs/architecture/patterns/
      # crud-entity.pattern.json), contre les 3 modules déjà validés
      # fichier par fichier (administrative-infrastructure/infrastructure,
      # administrative-boundary/region, coverage-areas/site-group — 3e
      # validation ajoutée le 2026-08-04). Script local
      # (tools/check-pattern-nx.mjs, pas un des outils vendorés
      # tools/seos/ — cf. son propre docstring).
      - name: check:pattern-nx (J-9, crud-entity Nx-shaped)
        run: bun run check:pattern-nx:crud-entity

      # T2-8 (ADR-0027/0028) — même vérification structurelle que
      # crud-entity ci-dessus, pour les 3 autres classes du catalogue de
      # patterns. Trouvé lors de l'audit Big Tech du 2026-08-14 : ces 3
      # scripts existaient dans check:all depuis T2-6/T2-8/T2-8-suite
      # (2026-08-13/14) mais n'avaient jamais reçu de step CI dédiée —
      # jamais exécutés automatiquement, même bug que check:dto-schema
      # (job docs-freshness) et check:pair-schema/check:corpus-tools
      # (job guardrails) : une commande "branchée dans check:all" n'est
      # bloquante que si check:all lui-même est invoqué en CI, ce qui
      # n'est jamais le cas (check:all est un raccourci local uniquement).
      - name: check:pattern-nx (T2-8, workflow-action Nx-shaped)
        run: bun run check:pattern-nx:workflow-action

      - name: check:pattern-nx (T2-8, action-request Nx-shaped)
        run: bun run check:pattern-nx:action-request

      - name: check:pattern-nx (T2-8 suite, read-only-view Nx-shaped)
        run: bun run check:pattern-nx:read-only-view

      # T11-7, généralisé 2026-08-14 (T2-8 suite) — toute entité des 4
      # classes du périmètre (scope.json) doit être couverte par l'un des
      # check:pattern-nx:* ci-dessus, sinon elle peut dériver en silence
      # (constat réel : optical-fiber-network/radio-relay-links construites
      # à 89.4 % sans jamais être vérifiées, cf. docstring de
      # tools/check-pattern-nx-coverage.mjs). Exceptions nominatives
      # documentées dans le script (KNOWN_GAPS/STRUCTURAL_EXCEPTIONS) ;
      # toute AUTRE entité manquante fait échouer ce job. Doit rester la
      # DERNIÈRE step check:pattern-nx du job — elle valide la cohérence
      # des 4 scripts précédents.
      - name: check:pattern-nx-coverage (T11-7, angle mort périmètre)
        run: bun run check:pattern-nx-coverage
