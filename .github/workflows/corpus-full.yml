# Corpus SEOS — verify complet (avec legacy figé)
# Audit B-5 / ADR-0014 / P0-6
#
# Différence vs job `corpus` (ci.yml) — ADR-0015 :
#   - ci.yml / corpus:ci  → --structural-only (oracles Nx, PAS de correspondance legacy)
#   - ce workflow         → --verify sans --structural-only (chemins legacy requis)
#
# Déclenchement : push sur main + manuel. Pas sur chaque PR (coût + auth legacy).
#
# Secrets requis :
#   LEGACY_CHECKOUT_TOKEN — PAT / deploy token lecture sur lock.repo (GitLab),
#     si le miroir GitHub ne porte pas le SHA piné.
#   NX_CLOUD_ACCESS_TOKEN — même secret que ci.yml (nxCloudId dans nx.json).
#     OPS-14 (2026-08-17) : ce workflow appelle `bun run corpus:full`, qui
#     invoque `nx run-many` par module via tools/corpus/module-gate.mjs.
#     Sans ce token, Nx Cloud refuse l'auth et NX **arrête tout le run**
#     ("Exiting run", pas juste le cache distant) — les 18 modules échouent
#     avant même que build/lint/test local ne s'exécute. Contrairement à
#     ci.yml (jobs indépendants, un 401 Nx Cloud n'y bloque qu'une tâche),
#     module-gate.mjs traite tout échec du process nx comme un échec de
#     gate H-2, sans distinguer "auth Nx Cloud" d'un vrai échec de build.

name: Corpus full — verify + legacy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Audit G-8 : un seul run actif sur main / dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.3'
  BUN_VERSION: '1.3.14'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  corpus-full:
    name: Corpus SEOS — full verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Checkout legacy (legacy.lock.json#commit)
        env:
          LEGACY_CHECKOUT_TOKEN: ${{ secrets.LEGACY_CHECKOUT_TOKEN }}
        run: bun run legacy:checkout
        # checkout-legacy.mjs écrit SEOS_LEGACY_ROOT dans $GITHUB_ENV

      - name: check:legacy-lock (concordance SHA)
        run: bun run check:legacy-lock

      - name: Corpus full (--verify, sans --structural-only)
        run: bun run corpus:full

      # OPS-20 (2026-08-17) : `corpus:full`/`emit-pairs.mjs` réécrit
      # corpus/*.pairs.jsonl à chaque run, mais ce run se termine sans
      # jamais commit/push ni publier d'artefact — le résultat recalculé
      # disparaît avec le runner. Les fichiers committés sur `main`
      # peuvent donc dériver silencieusement de ce que le générateur
      # produirait réellement aujourd'hui, sans qu'aucun gate ne le
      # détecte. Décision (pas de commit-back automatique — un run CI ne
      # doit jamais pousser silencieusement sur `main` sans revue
      # humaine/PR, même pour un artefact dérivé) : échouer bruyamment
      # si `corpus:full` a produit un résultat différent de ce qui est
      # committé, pour forcer une régénération explicite et revue plutôt
      # que de laisser la dérive s'accumuler jusqu'à la prochaine
      # investigation manuelle (voir OPS-15/17/18, découverts en mode
      # pompier).
      #
      # PREMIÈRE VERSION (git diff --exit-code brut) invalidée le jour
      # même par le premier run réel : `oracle_report.ran_at` et tout
      # `*.at` imbriqué sont horodatés par construction à CHAQUE appel de
      # `buildOracleReport()` (« evidence horodatée », voir
      # oracle-report.mjs) — un diff texte brut divergeait donc sur les
      # 18 fichiers à chaque exécution, même sans aucun changement
      # fonctionnel. `check-corpus-committed.mjs` compare paire par paire
      # après avoir retiré ces clés volatiles, pas un diff texte.
      # DIAGNOSTIC TEMPORAIRE (2026-08-17) — OPS-20, 3e faux positif consécutif
      # de check:corpus-committed. Les 2 rounds précédents (ran_at/at, puis
      # verified_at) ont chacun été confirmés insuffisants par le run CI réel
      # suivant. Cette étape affiche le diff texte brut ligne à ligne (avant
      # tout filtrage de clé volatile) pour identifier le/les champ(s) réels
      # en cause, plutôt que de deviner une 4e hypothèse sans preuve.
      # À RETIRER une fois le diagnostic obtenu — voir taches-restantes.md OPS-20.
      - name: DIAGNOSTIC — git diff brut corpus/shared.pairs.jsonl
        run: |
          echo "--- git diff --stat ---"
          git diff --stat -- corpus/ || true
          echo "--- git diff -U5 corpus/shared.pairs.jsonl (head -200) ---"
          git diff -U5 -- corpus/shared.pairs.jsonl | head -200 || true

      - name: check:corpus-committed (aucune dérive vs génération réelle)
        run: bun run check:corpus-committed
